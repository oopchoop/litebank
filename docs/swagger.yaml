basePath: /
definitions:
  httpapi.AuthRequest:
    properties:
      password:
        type: string
      phone_number:
        type: string
    type: object
  httpapi.AuthResponse:
    properties:
      user_token:
        type: string
    type: object
  httpapi.CreateAccountResponse:
    properties:
      id:
        type: integer
    type: object
  httpapi.CreateDepositRequest:
    properties:
      account_to_id:
        type: integer
      amount:
        type: integer
    type: object
  httpapi.CreateTransferRequest:
    properties:
      account_from_id:
        type: integer
      account_to_id:
        type: integer
      amount:
        type: integer
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  httpapi.MessageResponse:
    properties:
      message:
        type: string
    type: object
  httpapi.RegisterRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
    type: object
  httpapi.RegisterResponse:
    properties:
      id:
        type: integer
    type: object
  ledger.Account:
    properties:
      account_type_id:
        type: integer
      balance:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
    type: object
  ledger.Transfer:
    properties:
      account_from_id:
        type: integer
      account_to_id:
        type: integer
      amount:
        type: integer
      created_at:
        type: string
      id:
        type: integer
    type: object
  ledger.TransferIncoming:
    properties:
      account_from_id:
        type: integer
      account_to_id:
        type: integer
      amount:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      is_system:
        type: boolean
    type: object
  ledger.TransfersList:
    properties:
      transfers_incoming:
        items:
          $ref: '#/definitions/ledger.TransferIncoming'
        type: array
      transfers_sent:
        items:
          $ref: '#/definitions/ledger.Transfer'
        type: array
    type: object
host: localhost:8181
info:
  contact: {}
  description: API for bank LiteBank
  title: Litebank API
  version: "1.0"
paths:
  /accounts:
    get:
      consumes:
      - application/json
      description: Get accounts for user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ledger.Account'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Create new account for user
      produces:
      - application/json
      responses:
        "201":
          description: Success created account
          schema:
            $ref: '#/definitions/httpapi.CreateAccountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /auth:
    post:
      consumes:
      - application/json
      description: Authorization and create JWT token
      parameters:
      - description: Data for auth
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/httpapi.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: User auth
      tags:
      - auth
  /deposit:
    post:
      consumes:
      - application/json
      description: Create deposit for account
      parameters:
      - description: Unique key to prevent double deposit
        in: header
        name: Idempotency-Key
        type: string
      - description: Data for create deposit
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateDepositRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success deposit
          schema:
            $ref: '#/definitions/httpapi.MessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create deposit
      tags:
      - transfers
  /register:
    post:
      consumes:
      - application/json
      description: Create new user
      parameters:
      - description: Data for register
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/httpapi.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /transfer:
    post:
      consumes:
      - application/json
      description: Create transfer from account to another account
      parameters:
      - description: Unique key to prevent double tranfser
        in: header
        name: Idempotency-Key
        type: string
      - description: Data for create tranfser
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateTransferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success create transfer
          schema:
            $ref: '#/definitions/httpapi.MessageResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create transfer
      tags:
      - transfers
  /transfers:
    get:
      consumes:
      - application/json
      description: Get transfers for user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ledger.TransfersList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user transfers
      tags:
      - transfers
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
