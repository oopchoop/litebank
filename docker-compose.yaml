services:
  postgres:
    image: postgres:16-alpine
    container_name: litebank_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: litebank
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: litebank_db_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: litebank
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    container_name: litebank_api
    ports:
      - "8181:8181"
    environment:
      DATABASE_URL: "postgres://admin:admin@postgres:5432/litebank?sslmode=disable"
      APP_HOST: "0.0.0.0:8181"
      JWT_SECRET: "MrZKkEKGV5wSzMDNvRwN5gd6ijT3CdsyHG96iExa6WM="
    depends_on:
      postgres:
        condition: service_healthy


  adminer:
    image: adminer:latest
    container_name: litebank_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  postgres_test_data: